<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation de Salles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-50">
    <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <div id="header-container"></div>

    </div>
    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Page de réservation (par défaut) -->
        <div id="reservations-page">
            <!-- Sélection salle + navigation semaine -->
            <div class="bg-white rounded-xl shadow-md border border-blue-100 p-4 sm:p-6 mb-6">
                <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
                    <!-- Sélection salle -->
                    <div class="flex-1 max-w-md">
                        <label class="text-gray-700 mb-2 block flex items-center gap-2">
                            <i class="fas fa-map-pin w-4 h-4 text-blue-600"></i>
                            Choisir une salle
                        </label>
                        <select id="room-select" onchange="setSelectedRoom(this.value)" class="w-full h-12 border-2 border-blue-200 focus:border-blue-500 rounded-lg px-4 text-base">
                            <option value="">Sélectionnez une salle de réunion</option>
                            <option value="1">Salle A - Réunion</option>
                            <option value="2">Salle B - Conférence</option>
                            <option value="3">Salle C - Créativité</option>
                            <option value="4">Salle D - Collaboration</option>
                        </select>
                    </div>
                    <!-- Navigation semaine -->
                    <div class="flex items-center gap-3">
                        <button onclick="prevWeek()" class="p-2.5 border border-blue-200 hover:bg-blue-50 rounded-lg" title="Semaine précédente">
                            <i class="fas fa-chevron-left w-5 h-5"></i>
                        </button>
                        <div class="text-center min-w-[200px]">
                            <p class="text-sm text-gray-600">Semaine actuelle</p>
                            <p class="font-medium text-gray-900" id="current-week"></p>
                        </div>
                        <button onclick="nextWeek()" class="p-2.5 border border-blue-200 hover:bg-blue-50 rounded-lg" title="Semaine suivante">
                            <i class="fas fa-chevron-right w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Légende -->
            <div class="bg-white rounded-xl shadow-md border border-blue-100 p-4 mb-6">
                <div class="flex flex-wrap gap-6 items-center justify-start">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-green-500 rounded"></div>
                        <span class="text-sm text-gray-700">Disponible</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-red-400 rounded"></div>
                        <span class="text-sm text-gray-700">Réservé</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-blue-600 rounded"></div>
                        <span class="text-sm text-gray-700">Mes réservations</span>
                    </div>
                </div>
            </div>

            <!-- Calendrier -->
            <div id="calendar-container">
                <div class="bg-white rounded-xl shadow-md border border-blue-100 overflow-hidden mb-6">
                    <!-- Message si aucune salle -->
                    <div id="no-room-selected" class="p-8 text-center">
                        <i class="fas fa-map-pin w-12 h-12 text-blue-600 mx-auto mb-4"></i>
                        <h2 class="text-2xl font-bold text-blue-900 mb-2">Sélectionnez une salle</h2>
                        <p class="text-gray-600 max-w-md mx-auto">Choisissez une salle de réunion pour voir les créneaux disponibles</p>
                    </div>
                </div>
            </div>
        </div>

    <!-- Modal confirmation -->
    <div id="booking-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <!-- En-tête -->
            <div class="flex items-center gap-3 p-6 border-b border-gray-200">
                <i class="fas fa-calendar w-6 h-6 text-blue-600"></i>
                <h3 class="text-xl font-bold text-blue-900">Confirmer la réservation</h3>
            </div>
            
            <!-- Détails -->
            <div id="booking-details" class="p-6 space-y-4 hidden">
                <!-- Contenu dynamique -->
            </div>

            <!-- Ressources -->
            <div class="p-6 border-t border-gray-200">
                <label class="text-gray-700 mb-4 block">Ressources nécessaires (optionnel)</label>
                <div id="resources-list" class="space-y-3">
                    <!-- Checkboxes dynamiques -->
                </div>
            </div>

            <!-- Boutons -->
            <div class="flex gap-3 p-6 border-t border-gray-200 bg-gray-50 rounded-b-2xl">
                <button onclick="closeBookingModal()" class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 py-3 px-6 rounded-xl font-medium transition-colors">
                    Annuler
                </button>
                <button onclick="confirmBooking()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-xl font-medium transition-colors">
                    Confirmer la réservation
                </button>
            </div>
        </div>
    </div>


    <!-- FIN DU BODY : Script partagé -->
    <script src="/front/app.js"></script>
</body>
</html>
