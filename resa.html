<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Réservations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
    <div id="header-container"></div>

    

        <!-- Liste des réservations -->
        <div id="bookingsList">
            <!-- Contenu généré par JS -->
        </div>

        <!-- Dialog suppression (caché par défaut) -->
        <div id="deleteDialog" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4" onclick="closeDeleteDialog()">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6" onclick="event.stopPropagation()">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-trash text-red-600 text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-gray-900">Confirmer la suppression</h3>
                        <p class="text-gray-600">Êtes-vous sûr de vouloir supprimer cette réservation ? Cette action est irréversible.</p>
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button id="cancelDelete" onclick="closeDeleteDialog()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-900 py-2 px-4 rounded-lg font-medium transition-colors">
                        Annuler
                    </button>
                    <button id="confirmDelete" onclick="confirmDelete()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg font-medium transition-colors">
                        Supprimer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/front/mesResa.js"></script>
</body>
</html>
