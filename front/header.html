<!-- header.html (votre header + nav) -->
<header class="bg-white border-b border-blue-100 shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 py-4 border-b border-gray-200">
            <div>
                <h1 class="text-2xl font-bold text-blue-900 flex items-center gap-2">
                    <i class="fas fa-calendar w-7 h-7"></i>
                    Gestion des Réservations
                </h1>
                <p class="text-gray-600 text-sm mt-1">Planifiez et gérez vos espaces de travail</p>
            </div>
            <div class="flex items-center gap-3">
                <i class="fas fa-user w-5 h-5 text-blue-600"></i>
                <span class="text-gray-700 font-medium">Marie Martin</span>
                <button onclick="handleLogout()" class="p-2 hover:bg-blue-50 rounded-lg" title="Déconnexion">
                    <i class="fas fa-sign-out-alt w-5 h-5 text-gray-500 hover:text-red-500"></i>
                </button>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="flex gap-2 pt-2 overflow-x-auto" id="main-nav">
            <button onclick="navigateTo('reservations')" class="tab-btn px-4 py-3 rounded-t-lg" data-tab="reservations">
                <i class="fas fa-calendar w-4 h-4"></i> Réservations
            </button>
            <button onclick="navigateTo('resa')" class="tab-btn px-4 py-3 rounded-t-lg" data-tab="resa">
                <i class="fas fa-book-open w-4 h-4"></i> Mes réservations
            </button>
            <button onclick="navigateTo('salles')" class="tab-btn px-4 py-3 rounded-t-lg" data-tab="salles">
                <i class="fas fa-door-open w-4 h-4"></i> Salles
            </button>
            <button onclick="navigateTo('ressources')" class="tab-btn px-4 py-3 rounded-t-lg" data-tab="ressources">
                <i class="fas fa-box w-4 h-4"></i> Ressources
            </button>
            <button onclick="navigateTo('utilisateurs')" class="tab-btn px-4 py-3 rounded-t-lg" data-tab="utilisateurs">
                <i class="fas fa-users w-4 h-4"></i> Utilisateurs
            </button>
        </nav>
    </div>
</header>
